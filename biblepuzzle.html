<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bible Puzzle | UCKGC</title>
  <style>
    :root {
      --primary: #2e86de;
      --primary-dark: #1b4f72;
      --bg-light: #f0f8ff;
      --glass-bg: rgba(255, 255, 255, 0.85);
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #a8dadc, #f0f8ff);
      margin: 0;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .puzzle-box, .result-box {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      max-width: 700px;
      width: 100%;
      margin: auto;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      animation: fadeIn 1s ease;
    }
    h2 {
      color: var(--primary-dark);
      margin-bottom: 16px;
      font-size: 2rem;
    }
    .puzzle-word {
      font-size: 2.2rem;
      letter-spacing: 12px;
      margin: 20px 0;
      font-weight: bold;
      color: var(--primary);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    .clues {
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .clues p {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      font-style: italic;
      color: #444;
      transition: transform 0.2s;
    }
    .clues p:hover {
      transform: scale(1.05);
    }
    .letter-input {
      font-size: 1.2rem;
      padding: 10px 16px;
      width: 80%;
      border: 2px solid var(--primary);
      border-radius: 12px;
      margin-bottom: 20px;
      outline: none;
      text-transform: uppercase;
      text-align: center;
    }
    .submit-btn {
      margin: 4px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: 0.3s;
    }
    .submit-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }
    .feedback {
      font-weight: bold;
      margin: 16px 0;
      font-size: 1.2rem;
    }
    .correct {
      color: green;
      animation: glow 1s infinite alternate;
    }
    .wrong {
      color: red;
      animation: shake 0.4s;
    }
    .hidden { display: none; }
    .try-again-link {
      display: inline-block;
      margin-top: 20px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      background: var(--primary);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    .try-again-link:hover {
      background: var(--primary-dark);
    }
    ul { list-style: none; padding: 0; }
    li {
      font-weight: bold;
      margin: 8px 0;
      padding: 8px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    li:first-child { background: gold; color: #333; }
    li:nth-child(2) { background: silver; color: #333; }
    li:nth-child(3) { background: #cd7f32; color: #fff; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px green; }
      to { text-shadow: 0 0 15px lime; }
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <div class="puzzle-box" id="gameBox">
    <h2>📖 4 Hints, 1 Bible Word</h2>
    <div class="clues" id="clueText">Clues will appear here</div>
    <p class="puzzle-word" id="puzzleWord">Loading...</p>
    <input type="text" id="letterInput" class="letter-input" maxlength="20" placeholder="Enter your answer...">
    <br>
    <button class="submit-btn" id="submitBtn">Submit Answer</button>
    <p id="feedback" class="feedback hidden"></p>
    <br>
    <a href="dashboard.html">🔙 Back to Dashboard</a>
  </div>

  <div class="result-box hidden" id="resultBox">
    <h2>🎉 Game Over!</h2>
    <p id="finalScore"></p>
    <h3>🏆 Leaderboard</h3>
    <ul id="leaderboard"></ul>
    <button class="try-again-link" id="retryFromResult">🔁 Play Again</button>
    <br>
    <a href="dashboard.html">🔙 Back to Dashboard</a>
  </div>

  <audio id="correctSound" src="correct.mp3" preload="auto"></audio>
  <audio id="wrongSound" src="gameover.mp3" preload="auto"></audio>
  <audio id="bgMusic" src="backroundmusic.mp3" autoplay loop preload="auto"></audio>

  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabase = createClient(
    "https://wlthlwxcmltwescezjlk.supabase.co",
    "YOUR_SUPABASE_KEY_HERE"
  );

  const { data: sessionData } = await supabase.auth.getSession();
  const session = sessionData.session;
  if (!session) window.location.href = "index.html";

  const user = session.user;
  const userId = user.id;
  const fullName = user.user_metadata.full_name || user.email;

  const bgMusic = document.getElementById("bgMusic");
  bgMusic.volume = 0.3;
  bgMusic.play().catch(() => {
    document.body.addEventListener("click", () => bgMusic.play(), { once: true });
  });

  let puzzles = [];
  let currentIndex = 0;
  let score = 0;
  let puzzle = "";
  let hints = [];

  const puzzleWordEl = document.getElementById("puzzleWord");
  const clueText = document.getElementById("clueText");
  const inputEl = document.getElementById("letterInput");
  const feedbackEl = document.getElementById("feedback");
  const submitBtn = document.getElementById("submitBtn");
  const resultBox = document.getElementById("resultBox");
  const gameBox = document.getElementById("gameBox");
  const finalScoreEl = document.getElementById("finalScore");
  const leaderboardEl = document.getElementById("leaderboard");
  const retryFromResult = document.getElementById("retryFromResult");
  const correctSound = document.getElementById("correctSound");
  const wrongSound = document.getElementById("wrongSound");

  { word: "HOPE", hints: ["Future", "Faith", "Promise", "Trust"] },
  { word: "LOVE", hints: ["Greatest", "God", "Neighbor", "Command"] },

  { word: "WORD", hints: ["Bible", "Scripture", "Truth", "God"] },

  { word: "SALVATION", hints: ["Jesus", "Cross", "Faith", "Eternal Life"] },

  { word: "SPIRIT", hints: ["Holy", "Helper", "Comforter", "Pentecost"] },
  { word: "BIBLE", hints: ["Scripture", "Word", "Holy", "Book"] },
  { word: "PSALM", hints: ["Song", "David", "Worship", "Prayer"] },
  { word: "PROVERB", hints: ["Wisdom", "Solomon", "Sayings", "Truth"] },
  { word: "PARABLE", hints: ["Story", "Jesus", "Lesson", "Teaching"] },
  { word: "MIRACLE", hints: ["Healing", "Jesus", "Power", "Wonder"] },
  { word: "ANGEL", hints: ["Messenger", "Heaven", "Gabriel", "Wings"] },
  { word: "HEAVEN", hints: ["Eternal", "God", "Glory", "Home"] },
  { word: "HELL", hints: ["Fire", "Judgment", "Eternal", "Punishment"] },
  { word: "PRISON", hints: ["Chains", "Paul", "Peter", "Freedom"] },
  { word: "SWORD", hints: ["Battle", "Armor", "Spirit", "Word"] },
  { word: "ARMOR", hints: ["God", "Shield", "Faith", "Helmet"] },
  { word: "CROWN", hints: ["Victory", "Reward", "Life", "Heaven"] }
    ].sort(() => 0.5 - Math.random());
    currentIndex = 0;
  }

  function startGame() {
    if (currentIndex >= puzzles.length) {
      endGame();
      return;
    }
    const current = puzzles[currentIndex++];
    puzzle = current.word;
    hints = current.hints;
    puzzleWordEl.textContent = "_ ".repeat(puzzle.length);
    clueText.innerHTML = hints.map(h => `<p>📖 ${h}</p>`).join("");
    inputEl.value = "";
    inputEl.focus();
    feedbackEl.classList.add("hidden");
  }

  // ✅ Update puzzle lines live as user types
  inputEl.addEventListener("input", () => {
    const guess = inputEl.value.toUpperCase();
    let display = "";
    for (let i = 0; i < puzzle.length; i++) {
      display += guess[i] ? guess[i] + " " : "_ ";
    }
    puzzleWordEl.textContent = display.trim();
  });

  async function endGame() {
    gameBox.classList.add("hidden");
    resultBox.classList.remove("hidden");
    finalScoreEl.textContent = `You solved ${score} puzzle${score > 1 ? "s" : ""}!`;

    const { data: existing } = await supabase
      .from("biblepuzzle_leaderboard")
      .select("id, score")
      .eq("user_id", userId)
      .maybeSingle();

    if (existing) {
      if (score > existing.score) {
        await supabase
          .from("biblepuzzle_leaderboard")
          .update({ score })
          .eq("id", existing.id);
      }
    } else {
      await supabase
        .from("biblepuzzle_leaderboard")
        .insert([{ user_id: userId, name: fullName, score }]);
    }

    const { data: topScores } = await supabase
      .from("biblepuzzle_leaderboard")
      .select("name, score")
      .order("score", { ascending: false });

    leaderboardEl.innerHTML = "";
    topScores.slice(0, 5).forEach((row, idx) => {
      leaderboardEl.innerHTML += `<li> ${idx+1}. <strong>${row.name}</strong>: ${row.score}</li>`;
    });
  }

  submitBtn.onclick = () => {
    const guess = inputEl.value.trim().toUpperCase();

    // ✅ If empty, show warning
    if (!guess) {
      feedbackEl.textContent = "⚠️ Please enter a word!";
      feedbackEl.className = "feedback wrong";
      feedbackEl.classList.remove("hidden");
      return;
    }

    if (guess === puzzle) {
      correctSound.play();
      score++;
      feedbackEl.textContent = `✅ Correct! The word was "${puzzle}"`;
      feedbackEl.className = "feedback correct";
      feedbackEl.classList.remove("hidden");
      setTimeout(startGame, 2000);
    } else {
      wrongSound.play();
      feedbackEl.textContent = `❌ Wrong! Correct answer: ${puzzle}`;
      feedbackEl.className = "feedback wrong";
      feedbackEl.classList.remove("hidden");
      setTimeout(endGame, 2000);
    }
  };

  retryFromResult.onclick = () => {
    score = 0;
    shufflePuzzles();
    resultBox.classList.add("hidden");
    gameBox.classList.remove("hidden");
    startGame();
  };

  shufflePuzzles();
  startGame();
</script>

</body>
</html>
